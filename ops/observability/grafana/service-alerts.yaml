groups:
  - name: aerealith-service-red
    interval: 1m
    rules:
      - alert: AerealithServiceHighErrorRate
        expr: |
          (
            sum by (service_name) (rate(aerealith_api_server_failures_total[5m]))
            /
            clamp_min(
              sum by (service_name) (rate(aerealith_api_server_requests_total[5m])),
              0.000001
            )
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "High error rate for {{ $labels.service_name }}"
          description: "More than 5% of requests have failed for 10 minutes."
          runbook_url: "ops/observability/runbooks/service-observability.md"

      - alert: AerealithServiceHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (
              rate(aerealith_api_server_duration_bucket[5m])
            )
          ) > 2000
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "High p95 latency for {{ $labels.service_name }}"
          description: "p95 request latency has exceeded 2 seconds for 10 minutes."
          runbook_url: "ops/observability/runbooks/service-observability.md"

      - alert: AerealithServiceSustainedFailures
        expr: |
          sum by (service_name) (
            increase(aerealith_api_server_failures_total[10m])
          ) >= 20
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Sustained failures for {{ $labels.service_name }}"
          description: "At least 20 request failures occurred in the last 10 minutes."
          runbook_url: "ops/observability/runbooks/service-observability.md"
