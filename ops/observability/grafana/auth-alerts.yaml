groups:
  - name: aerealith-auth
    interval: 1m
    rules:
      - alert: AerealithAuthHighErrorRatio
        expr: |
          sum(rate(aerealith_api_server_requests_total{service_name="auth",http_response_status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(aerealith_api_server_requests_total{service_name="auth"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
          service: auth
        annotations:
          summary: Auth API 5xx ratio is above 5%
          runbook_url: ops/observability/runbooks/auth-service.md
      - alert: AerealithAuthHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(aerealith_api_server_duration_milliseconds_bucket{service_name="auth"}[5m])
            )
          ) > 1000
        for: 15m
        labels:
          severity: warning
          service: auth
        annotations:
          summary: Auth API p95 latency is above one second
          runbook_url: ops/observability/runbooks/auth-service.md
      - alert: AerealithAuthNoTelemetry
        expr: absent_over_time(aerealith_api_server_requests_total{service_name="auth"}[15m])
        for: 5m
        labels:
          severity: warning
          service: auth
        annotations:
          summary: Auth request telemetry is absent
          runbook_url: ops/observability/runbooks/auth-service.md
      - alert: AerealithAuthLoginFailureSpike
        expr: |
          sum(rate(aerealith_auth_operations_total{operation="login",outcome="failure"}[10m]))
          /
          clamp_min(sum(rate(aerealith_auth_operations_total{operation="login"}[10m])), 0.001)
          > 0.5
        for: 15m
        labels:
          severity: warning
          service: auth
        annotations:
          summary: More than half of auth login attempts are failing
          runbook_url: ops/observability/runbooks/auth-service.md
