  piscina@4.9.3: 4.9.4
  browserslist@4.28.6: 4.28.9
  markdown-it@14.2.0: 14.3.3
  source-map-js@1.2.1: 1.2.2
  svgo@3.3.4: 3.3.5
  systeminformation@5.33.1: 5.33.19
  baseline-browser-mapping@2.10.43: 2.11.35
  postcss@8.5.19: 8.5.32
  postcss-selector-parser@7.1.4: 7.1.7
