packages:
  - apps/services/*
  - libs/*
  - tools/generators/*
autoInstallPeers: true
resolvePeersFromWorkspaceRoot: true
dedupePeerDependents: true
dedupeDirectDeps: true
allowBuilds:
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  # Keep each security override on the same major line. A global pin would
  # replace brace-expansion 1.x/2.x/3.x with 5.x and break those callers.
  hono: 4.13.16
  proxy-addr: 2.0.8
  smol-toml: 1.9.1
  '@opentelemetry/core': 2.9.0
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  axios: 1.21.0
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.21
  'brace-expansion@>=2.0.0 <3.0.0': 2.1.7
  'brace-expansion@>=3.0.0 <4.0.0': 3.0.9
  'brace-expansion@>=5.0.0 <6.0.0': 5.0.12
  'fast-uri@>=3.0.0 <4.0.0': 3.1.9
  'js-yaml@>=3.0.0 <4.0.0': 3.15.2
  'js-yaml@>=4.0.0 <5.0.0': 4.3.2
  'js-yaml@>=5.0.0 <6.0.0': 5.5.0
  nanoid@3.3.16: 3.3.18
  react-router@7.18.1: 7.18.2
  'sharp@>=0.34.5 <0.35.5': 0.35.5
  'undici@>=6.0.0 <7.0.0': 6.29.1
  'undici@>=7.0.0 <8.0.0': 7.30.2
  'dompurify@>=3.0.0 <4.0.0': 3.4.17
  '@fastify/busboy@>=3.0.0 <4.0.0': 3.2.5
  '@grpc/grpc-js@>=1.14.0 <1.15.0': 1.14.7
  'body-parser@>=1.20.0 <1.21.0': 1.20.9
  'qs@>=6.0.0 <7.0.0': 6.17.1
  'follow-redirects@>=1.0.0 <2.0.0': 1.16.2
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260730.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260730.1'
  - '@cloudflare/workerd-linux-64@1.20260730.1'
  - '@cloudflare/workerd-linux-arm64@1.20260730.1'
  - '@cloudflare/workerd-windows-64@1.20260730.1'
  - miniflare@4.20260730.0
  - workerd@1.20260730.1
  - wrangler@4.116.0
  - '@fastify/busboy@3.2.5'
  - undici@7.30.2
