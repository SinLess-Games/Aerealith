packages:
  - apps/services/*
  - libs/*
  - tools/generators/*
autoInstallPeers: true
resolvePeersFromWorkspaceRoot: true
dedupePeerDependents: true
dedupeDirectDeps: true
allowBuilds:
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
overrides:
  '@opentelemetry/core': 2.9.0
  '@esbuild-kit/core-utils>esbuild': 0.28.1
  axios: 1.18.1
  brace-expansion: 5.0.9
  fast-uri@3.1.3: 3.1.5
  js-yaml@3.15.0: 3.15.1
  js-yaml@4.3.0: 4.3.1
  js-yaml@5.2.0: 5.2.2
  js-yaml@5.2.1: 5.2.2
  nanoid@3.3.16: 3.3.18
  react-router@7.18.1: 7.18.2
  sharp@0.34.5: 0.35.2
  undici@7.28.0: 7.29.0
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260730.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260730.1'
  - '@cloudflare/workerd-linux-64@1.20260730.1'
  - '@cloudflare/workerd-linux-arm64@1.20260730.1'
  - '@cloudflare/workerd-windows-64@1.20260730.1'
  - miniflare@4.20260730.0
  - workerd@1.20260730.1
  - wrangler@4.116.0
