apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium
    app.kubernetes.io/instance: cilium
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: aerealith-platform
    app.kubernetes.io/managed-by: flux
spec:
  interval: 30m

  releaseName: cilium
  suspend: true

  targetNamespace: kube-system
  storageNamespace: kube-system

  chart:
    spec:
      chart: cilium
      version: '1.20.1'
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h

  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml

  install:
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 1
      strategy: rollback

  rollback:
    cleanupOnFail: true
    timeout: 10m

  timeout: 10m
