apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aerealith-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m

  path: ./infra/kubernetes

  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: aerealith
    namespace: flux-system
