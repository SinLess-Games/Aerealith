apiVersion: v1
kind: ConfigMap
metadata:
  name: pyroscope-values
  namespace: observability
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: aerealith-platform
data:
  values.yaml: |
    pyroscope:
      replicaCount: 1
      disableSelfProfile: true

      extraArgs:
        log.level: info

      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi

      persistence:
        enabled: true
        accessModes:
          - ReadWriteOnce
        size: 20Gi

      structuredConfig:
        storage:
          backend: filesystem
          filesystem:
            dir: /data/v2/shared

      podDisruptionBudget:
        enabled: false

    architecture:
      storage:
        v1: false
        v2: true
      microservices:
        enabled: false

    # eBPF profiling is deployed as a separate privileged DaemonSet.
    alloy:
      enabled: false

    agent:
      enabled: false

    minio:
      enabled: false

    ingress:
      enabled: false

    httpRoute:
      enabled: false

    serviceMonitor:
      enabled: true
      interval: 30s
