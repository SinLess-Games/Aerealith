apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pyroscope-ingress
  namespace: observability
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: aerealith-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: profiling-system
      ports:
        - protocol: TCP
          port: 4040
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 4040
