cluster:
  allowSchedulingOnControlPlanes: false

  network:
    cni:
      name: none

    podSubnets:
      - 10.200.0.0/16

    serviceSubnets:
      - 10.201.0.0/16

machine:
  install:
    disk: /dev/sda
    image: factory.talos.dev/metal-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.13.9

  kubelet:
    nodeIP:
      validSubnets:
        - 10.42.0.0/24

  extraArgs:
    rotate-server-certificates: 'true'
