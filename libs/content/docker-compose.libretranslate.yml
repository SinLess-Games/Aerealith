name: aerealith-content-translation

services:
  libretranslate:
    image: libretranslate/libretranslate:latest@sha256:4a48d5fd9ed482b61fa28803e4438603caf4cab92685e659cb4811178b2039dc
    container_name: aerealith-libretranslate
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        until python -c "import urllib.request; urllib.request.urlopen('https://raw.githubusercontent.com/argosopentech/argospm-index/main/index.json', timeout=15)"; do
          echo 'Waiting for Docker outbound network before loading translation models...'
          sleep 5
        done
        exec ./scripts/entrypoint.sh --host 0.0.0.0 --port 5000 --update-models --load-only "${LIBRETRANSLATE_LOAD_LANGUAGES:-ar,cs,da,de,en,es,fi,fr,he,hu,id,it,ja,ko,nb,nl,pl,pt,ro,ru,sv,tr,uk,vi,zh-Hans,zh-Hant}"
    ports:
      - "127.0.0.1:${LIBRETRANSLATE_PORT:-5000}:5000"
    volumes:
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=10));
          assert isinstance(data, list) and len(data) > 0
      interval: 15s
      timeout: 12s
      retries: 40
      start_period: 120s

  translator:
    image: node:26-bookworm-slim@sha256:add5c17c14752c54d2f3d519ec46a3815684d41c33f198bcb09fb998f7dcbf68
    profiles:
      - tools
    init: true
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint:
      - /workspace/node_modules/.bin/tsx
    environment:
      LIBRETRANSLATE_URL: http://libretranslate:5000
    volumes:
      - ../..:/workspace
    depends_on:
      libretranslate:
        condition: service_healthy

volumes:
  libretranslate-models:
    name: aerealith-libretranslate-models
