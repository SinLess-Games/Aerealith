services:
  postgres:
    image: postgres:17-alpine
    container_name: aerealith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aerealith}
      POSTGRES_USER: ${POSTGRES_USER:-aerealith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aerealith}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - aerealith-postgres-data:/var/lib/postgresql/data

volumes:
  aerealith-postgres-data:
