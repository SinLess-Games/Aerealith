<!doctype html>
<html lang="en-US" data-theme="dark">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <base href="/" />

    <!-- Fallback metadata. Replace per public route at build time or SSR/SSG. -->
    <title>Aerealith — Your Digital Life, Intelligently Connected</title>
    <meta
      name="description"
      content="Aerealith is a modular, trust-first platform in active development for connected applications, communities, information, and approved workflows."
    />

    <!-- Do not include a universal canonical here for a multi-route SPA. -->
    <!-- Emit exactly one route-specific canonical for each public route. -->

    <meta name="author" content="SinLess Games LLC" />
    <meta name="application-name" content="Aerealith" />

    <meta name="theme-color" content="#050a1e" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="manifest" href="/site.webmanifest" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Aerealith" />
    <meta name="msapplication-TileColor" content="#050a1e" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#7c3aed" />

    <!-- Organization/WebSite are truthful global entities. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aerealith.com/#organization",
            "name": "SinLess Games LLC",
            "url": "https://aerealith.com/",
            "brand": {
              "@type": "Brand",
              "name": "Aerealith",
              "url": "https://aerealith.com/"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://aerealith.com/#website",
            "name": "Aerealith",
            "url": "https://aerealith.com/",
            "publisher": {
              "@id": "https://aerealith.com/#organization"
            },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>

    <script>
      (() => {
        const storageKey = 'aerealith-theme';
        const fallbackTheme = 'dark';

        try {
          const storedMode = window.localStorage.getItem(storageKey);
          const prefersDark =
            window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true;
          const systemTheme = prefersDark ? 'dark' : 'light';
          const resolvedTheme =
            storedMode === 'light' || storedMode === 'dark'
              ? storedMode
              : systemTheme;
          const root = document.documentElement;
          const themeColor = resolvedTheme === 'dark' ? '#050a1e' : '#f8f8ff';

          root.dataset.theme = resolvedTheme;
          root.style.colorScheme = resolvedTheme;

          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', themeColor);
        } catch {
          const root = document.documentElement;
          root.dataset.theme = fallbackTheme;
          root.style.colorScheme = fallbackTheme;
        }
      })();
    </script>

    <link rel="stylesheet" href="/src/styles.css" />

    <meta name="google-adsense-account" content="ca-pub-9610840170359196" />
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      <main>
        <h1>Aerealith</h1>
        <p>
          Aerealith is a modular, trust-first platform in active development for
          connected applications, communities, information, and approved
          workflows.
        </p>
        <nav aria-label="Public pages">
          <a href="/pricing">Pricing</a>
          <a href="/about">About</a>
          <a href="/contact">Contact</a>
          <a href="/policies/privacy">Privacy</a>
          <a href="/policies/terms-of-use">Terms of Use</a>
        </nav>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
