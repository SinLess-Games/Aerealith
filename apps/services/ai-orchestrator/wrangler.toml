"$schema" = "../../../node_modules/wrangler/config-schema.json"

name = "aerealith-ai-orchestrator"
main = "src/main.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
upload_source_maps = true

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true

[vars]
ENVIRONMENT = "production"
AI_PROVIDER_CATALOG = "[]"
AI_RUNS_PER_MINUTE = "60"
AI_RATE_LIMIT_WINDOW_MS = "60000"
AI_DAILY_RUN_LIMIT = "0"
AI_DAILY_COST_BUDGET_USD = "0"

QDRANT_URL = "https://6f069294-5f27-4777-9c34-128b132ab175.australia-southeast1-0.gcp.cloud.qdrant.io"
QDRANT_COLLECTION = "aerealith-knowledge-v1"

OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
OTEL_SERVICE_NAMESPACE = "aerealith"
OTEL_SERVICE_NAME = "ai-orchestrator"

PROMETHEUS_METRICS_URL = "https://prometheus-prod-67-prod-us-west-0.grafana.net/api/prom/push"
PROMETHEUS_USER_ID = "3406144"

LOKI_LOGGING_URL = "https://logs-prod-021.grafana.net"
LOKI_USER_ID = "1698747"

TEMPO_TRACING_URL = "https://tempo-prod-15-prod-us-west-0.grafana.net/tempo"
TEMPO_USER_ID = "1693048"

PYROSCOPE_URL = "https://profiles-prod-008.grafana.net"
PYROSCOPE_USER_ID = "1740960"

[[workflows]]
name = "aerealith-ai-orchestration"
binding = "AI_ORCHESTRATION_WORKFLOW"
class_name = "AiOrchestrationWorkflow"

[[durable_objects.bindings]]
name = "AI_RUN_STATE"
class_name = "AiRunState"

[[durable_objects.bindings]]
name = "AI_RUN_INDEX"
class_name = "AiRunIndex"

[[durable_objects.bindings]]
name = "AI_RATE_LIMIT"
class_name = "AiRateLimit"

[[durable_objects.bindings]]
name = "AI_USAGE"
class_name = "AiUsageLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiRunState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AiRunIndex"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AiRateLimit"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AiUsageLedger"]

[[services]]
binding = "AUTH_WORKER"
service = "aerealith-auth"

[[r2_buckets]]
binding = "AI_ARTIFACTS"
bucket_name = "aerealith-ai"

# Account-level Cloudflare Secrets Store bindings.
# Secret values remain outside source control.
[[secrets_store_secrets]]
binding = "QDRANT_API_KEY"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "QDRANT_API_KEY"





