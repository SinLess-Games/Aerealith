"$schema" = "../../../node_modules/wrangler/config-schema.json"

name = "aerealith-ai-orchestrator"
main = "src/main.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
upload_source_maps = true

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true

[vars]
ENVIRONMENT = "production"
AI_PROVIDER_CATALOG = "[]"
AI_RUNS_PER_MINUTE = "60"
AI_RATE_LIMIT_WINDOW_MS = "60000"
AI_DAILY_RUN_LIMIT = "0"
AI_DAILY_COST_BUDGET_USD = "0"

QDRANT_URL = "https://6f069294-5f27-4777-9c34-128b132ab175.australia-southeast1-0.gcp.cloud.qdrant.io"
QDRANT_COLLECTION = "aerealith-knowledge-v1"

# Grafana Cloud logs/traces are exported through account-level Cloudflare
# Workers Observability destinations, not Worker runtime credentials.
# After destinations are created, add their names under observability.logs
# and observability.traces.
[[workflows]]
name = "aerealith-ai-orchestration"
binding = "AI_ORCHESTRATION_WORKFLOW"
class_name = "AiOrchestrationWorkflow"

[[durable_objects.bindings]]
name = "AI_RUN_STATE"
class_name = "AiRunState"

[[durable_objects.bindings]]
name = "AI_RUN_INDEX"
class_name = "AiRunIndex"

[[durable_objects.bindings]]
name = "AI_RATE_LIMIT"
class_name = "AiRateLimit"

[[durable_objects.bindings]]
name = "AI_USAGE"
class_name = "AiUsageLedger"

[[durable_objects.bindings]]
name = "AI_CODE_SANDBOX"
class_name = "AiCodeSandbox"

[[durable_objects.bindings]]
name = "AI_CONVERSATION_STATE"
class_name = "AiConversationState"

[[durable_objects.bindings]]
name = "AI_CONVERSATION_INDEX"
class_name = "AiConversationIndex"

[[durable_objects.bindings]]
name = "AI_KNOWLEDGE_CATALOG"
class_name = "AiKnowledgeCatalog"

[[containers]]
class_name = "AiCodeSandbox"
image = "./Dockerfile.sandbox"
instance_type = "standard-1"
max_instances = 20

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiRunState"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AiRunIndex"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["AiRateLimit"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AiUsageLedger"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["AiCodeSandbox"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["AiConversationState"]

[[migrations]]
tag = "v7"
new_sqlite_classes = ["AiConversationIndex"]

[[migrations]]
tag = "v8"
new_sqlite_classes = ["AiKnowledgeCatalog"]

[[services]]
binding = "AUTH_WORKER"
service = "aerealith-auth"

[[r2_buckets]]
binding = "AI_ARTIFACTS"
bucket_name = "aerealith-ai"

# Account-level Cloudflare Secrets Store bindings.
# Secret values remain outside source control.
[[secrets_store_secrets]]
binding = "QDRANT_API_KEY"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "QDRANT_API_KEY"





