"$schema" = "../../../node_modules/wrangler/config-schema.json"

name = "aerealith-api"
main = "src/worker.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
preview_urls = true
workers_dev = true
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[analytics_engine_datasets]]
binding = "AEREALITH_ANALYTICS"
dataset = "AerealithServiceMetrics"

[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://aerealith.com"

[[env.preview.analytics_engine_datasets]]
binding = "AEREALITH_ANALYTICS"
dataset = "AerealithServiceMetrics"

[env.preview.vars]
NODE_ENV = "development"
FRONTEND_URL = "http://localhost:4200"

[[flagship]]
binding = "FLAGSHIP_FLAGS"
app_id = "2a1ca9ba-b446-4cb8-b8eb-ab0f3985679f"
remote = true

# Production secrets are account-level Secrets Store bindings. Secret values
# remain outside source control and are resolved only inside the Worker.

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "DATABASE_URL"





[[env.preview.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "PREVIEW_POSTGRES_URL"

[[r2_buckets]]
binding = "AEREALITH_AI"
bucket_name = "aerealith-ai"
