[tool.coverage.run]
branch = true
source = ["discord_bot"]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/apps/services/discord-bot/html'
 --cov-report xml:'../../../coverage/apps/services/discord-bot/coverage.xml'
 --html='../../../reports/apps/services/discord-bot/unittests/html/index.html'
 --junitxml='../../../reports/apps/services/discord-bot/unittests/junit.xml'
"""

[tool.basedpyright]
include = [
    "discord_bot/api",
    "discord_bot/cache",
    "discord_bot/commands",
    "discord_bot/core/__init__.py",
    "discord_bot/core/bot.py",
    "discord_bot/core/dependencies.py",
    "discord_bot/core/intents.py",
    "discord_bot/core/lifecycle.py",
    "discord_bot/events",
    "discord_bot/main.py",
    "discord_bot/music",
    "discord_bot/services",
    "discord_bot/webhooks",
    "tests",
]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venv = ".venv"
venvPath = "."

[tool.poetry]
name = "discord-bot"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = []
license = 'Proprietary'
readme = 'README.md'

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10,<2.0"

[[tool.poetry.packages]]
include = "discord_bot"

[tool.poetry.scripts]
aerealith-discord-bot = "discord_bot.main:run"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
mafic = { version = ">=2.11,<3.0", extras = ["speedups"] }
disnake = {version = ">=2.12.1,<2.13.0", extras = ["speed", "voice"]}
httpx = {extras = ["http2"], version = "^0.28.1"}
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
tenacity = "^9.1.4"
msgspec = "^0.21.1"
redis = {extras = ["hiredis"], version = "^8.1.0"}
aio-pika = "^10.0.1"
regex = "^2026.7.19"
rapidfuzz = "^3.14.5"
confusable-homoglyphs = "^3.3.1"
tldextract = "^5.3.2"
pillow = "^12.3.0"
numpy = "^2.5.2"
soxr = "^1.1.0"
structlog = "^26.1.0"
sentry-sdk = "^2.68.1"
prometheus-client = "^0.26.0"
taskiq = "^0.12.5"
taskiq-aio-pika = "^0.6.0"
taskiq-redis = "^1.2.3"

[tool.poetry.group.dev.dependencies]
autopep8 = "2.3.1"
flake8 = "7.1.1"
pytest = "^9.1.1"
pytest-sugar = "1.0.0"
pytest-cov = "^7.1.0"
pytest-html = "4.1.1"
pytest-asyncio = "^1.4.0"
hypothesis = "^6.165.10"
respx = "^0.23.1"
ruff = "^0.16.4"
basedpyright = "^1.39.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
