"$schema" = "../../../node_modules/wrangler/config-schema.json"

name = "aerealith-auth"
main = "src/worker.ts"

compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

preview_urls = true
workers_dev = true
upload_source_maps = true


# =============================================================================
# Observability
# =============================================================================

[observability]
enabled = true
head_sampling_rate = 1


[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true


[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1


# =============================================================================
# Production environment
# =============================================================================

[vars]
NODE_ENV = "production"
FRONTEND_URL = "https://aerealith.com"
RESEND_FROM_EMAIL = "Aerealith <auth@example.com>"
OTEL_EXPORTER_OTLP_ENDPOINT = "https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
OTEL_SERVICE_NAMESPACE = "aerealith"
OTEL_SERVICE_VERSION = "development"
OTEL_TRACES_SAMPLER = "parentbased_traceidratio"
OTEL_TRACES_SAMPLER_ARG = "0.25"
OTEL_METRIC_EXPORT_INTERVAL = "60000"
PROMETHEUS_METRICS_URL = "https://prometheus-prod-67-prod-us-west-0.grafana.net/api/prom/push"
PROMETHEUS_USER_ID = "3406144"
LOKI_LOGGING_URL = "https://logs-prod-021.grafana.net"
LOKI_NAME = "grafanacloud-sinlessindustries-logs"
LOKI_USER_ID = "1698747"
TEMPO_TRACING_URL = "https://tempo-prod-15-prod-us-west-0.grafana.net/tempo"
TEMPO_NAME = "grafanacloud-sinlessindustries-traces"
TEMPO_USER_ID = "1693048"
TURNSTILE_HOSTNAMES = "localhost,127.0.0.1"


# -----------------------------------------------------------------------------
# Feature flags
# -----------------------------------------------------------------------------

[[flagship]]
binding = "FLAGSHIP_FLAGS"
app_id = "2a1ca9ba-b446-4cb8-b8eb-ab0f3985679f"
remote = true


# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "DATABASE_URL"


[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "RESEND_API_KEY"


[[secrets_store_secrets]]
binding = "OTEL_EXPORTER_OTLP_HEADERS"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "OTEL_EXPORTER_OTLP_HEADERS"


[[secrets_store_secrets]]
binding = "PROMETHEUS_TOKEN"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "PROMETHEUS_TOKEN"


[[secrets_store_secrets]]
binding = "LOKI_TOKEN"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "LOKI_TOKEN"


[[secrets_store_secrets]]
binding = "TEMPO_TOKEN"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "TEMPO_TOKEN"


# -----------------------------------------------------------------------------
# Authentication rate limiting
# -----------------------------------------------------------------------------

[[ratelimits]]
name = "AUTH_SENSITIVE_RATE_LIMIT"
namespace_id = "1003"

[ratelimits.simple]
limit = 10
period = 60


# =============================================================================
# Preview / local development environment
# =============================================================================

[env.preview]
name = "aerealith-auth-preview"
workers_dev = true
preview_urls = true


[env.preview.vars]
NODE_ENV = "development"
FRONTEND_URL = "http://localhost:4200"


# -----------------------------------------------------------------------------
# Preview feature flags
# -----------------------------------------------------------------------------

[[env.preview.flagship]]
binding = "FLAGSHIP_FLAGS"
app_id = "2a1ca9ba-b446-4cb8-b8eb-ab0f3985679f"
remote = true


# -----------------------------------------------------------------------------
# Preview secrets
# -----------------------------------------------------------------------------

[[env.preview.secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "PREVIEW_POSTGRES_URL"


[[env.preview.secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "ab6f1fdec6a246578177e0577e94f40b"
secret_name = "RESEND_API_KEY"


# -----------------------------------------------------------------------------
# Preview authentication rate limiting
# -----------------------------------------------------------------------------

[[env.preview.ratelimits]]
name = "AUTH_SENSITIVE_RATE_LIMIT"
namespace_id = "1002"

[env.preview.ratelimits.simple]
limit = 10
period = 60
