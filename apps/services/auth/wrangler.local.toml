"$schema" = "../../../node_modules/wrangler/config-schema.json"

name = "aerealith-auth-local"
main = "src/worker.ts"

compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

workers_dev = false
preview_urls = false


[vars]
NODE_ENV = "development"
FRONTEND_URL = "http://localhost:4200"
LOCAL_REGISTRATION_ENABLED = "true"


# Wrangler loads only these values from the ignored root .env passed through
# --env-file. Deployed environments use the separate Secrets Store bindings in
# wrangler.toml.
[secrets]
required = ["DATABASE_URL"]


[[ratelimits]]
name = "AUTH_SENSITIVE_RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60
