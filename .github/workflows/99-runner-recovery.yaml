name: 99 · Runner Recovery

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/99-runner-recovery.yaml'

permissions:
  contents: read

jobs:
  restart-runners:
    runs-on: [self-hosted, linux, x64, aerealith, docker]
    timeout-minutes: 10

    steps:
      - name: Schedule detached runner recreation
        shell: bash
        env:
          COMPOSE_B64: 
        run: |
          set -euo pipefail

          docker rm -f aerealith-runner-restart-helper >/dev/null 2>&1 || true

          docker run -d \
            --name aerealith-runner-restart-helper \
            -e COMPOSE_B64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /mnt/disk-sdc/Projects/local-services:/mnt/disk-sdc/Projects/local-services \
            -v /opt/aerealith-github-runners:/opt/aerealith-github-runners \
            docker:27-cli \
            sh -c '
              set -eu

              if ! docker compose version >/dev/null 2>&1; then
                apk add --no-cache docker-cli-compose
              fi

              sleep 12

              env_file=/mnt/disk-sdc/Projects/local-services/github-runners/.env
              compose_file=/opt/aerealith-github-runners/docker-compose.yaml

              test -s "$env_file"
              grep -Eq "^REPO_URL=.+" "$env_file"
              grep -Eq "^ACCESS_TOKEN=.+" "$env_file"

              mkdir -p \
                /opt/aerealith-github-runners/runner-01 \
                /opt/aerealith-github-runners/runner-02 \
                /opt/aerealith-github-runners/runner-03 \
                /opt/aerealith-github-runners/runner-04 \
                /opt/aerealith-github-runners/runner-05 \
                /opt/aerealith-github-runners/runner-06

              printf "%s" "$COMPOSE_B64" | base64 -d > "$compose_file"

              docker compose -p aerealith-runners -f "$compose_file" config --quiet
              docker compose -p aerealith-runners -f "$compose_file" pull

              for n in 01 02 03 04 05 06; do
                docker rm -f "aerealith-github-runner-$n" >/dev/null 2>&1 || true
              done

              docker compose -p aerealith-runners -f "$compose_file" up -d --force-recreate

              sleep 15

              docker ps --filter "name=aerealith-github-runner-" \
                --format "{{.Names}} {{.Status}}"
            '

          echo "Detached helper launched. It will recreate all six runners after this job exits."
