name: zz · Refresh observability lockfile

on:
  push:
    branches:
      - feat/platform-observability
    paths:
      - 'libs/observability/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/zz-refresh-lockfile-observability.yaml'

permissions:
  contents: write

concurrency:
  group: observability-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, aerealith, docker]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.0
          package-manager-cache: false

      - name: Set up pnpm
        shell: bash
        run: npm install --global pnpm@11.13.1

      - name: Refresh lockfile
        shell: bash
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(observability): refresh pnpm lockfile"
          git push origin HEAD:feat/platform-observability
