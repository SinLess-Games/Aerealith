name: 'Copilot Setup Steps'

on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

  pull_request:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - '.gitattributes'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  # Required name for GitHub Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.13.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.5.0'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify development environment
        run: |
          node --version
          pnpm --version
          git lfs version
          git lfs ls-files
          pnpm nx --version
